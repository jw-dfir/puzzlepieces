[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["audit", "engine", "evaluate", "exporter", "gui", "helpers", "jobs", "layouts", "models", "parser", "synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
